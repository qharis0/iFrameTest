<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock Video Feed</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>

<body>
  <main id="feed" aria-label="Curated video feed"></main>

  <div class="toolbar">
    <span id="position">Not started</span>
    <button id="quit" disabled>End session</button>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="panel">
      <h1>Mock Video Feed</h1>
      <p>This version is just to get TikTok embeds to work. MAKE COPIES FOR INTERVENTIONS.</p>
      <button id="start">Begin Session</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="panel">
      <h1>Session ended</h1>
      <p id="summary"></p>
      <button id="download">Download session JSON</button>
      <button id="restart">Restart</button>
    </div>
  </div>
</body>
</html>
